  <!-- Measurements and modelling constraints. -->
  <path class="measure" d="M75 106V742 M65 106H85 M65 742H85"/>
  <text x="92" y="430" class="label" transform="rotate(-90 92 430)">1.10 m total</text>
  <path class="measure" d="M190 105H470 M190 95V115 M470 95V115"/>
  <text x="254" y="102" class="small">head ≈ 45% height</text>

  <g transform="translate(52 842)">
    <text class="small">Silhouette anchors: five-point crest • tall ears • deep muzzle + large nose • narrow chest • elbow-low arms • fist-sized hands • cuffed shorts • split oversized shoes</text>
  </g>
